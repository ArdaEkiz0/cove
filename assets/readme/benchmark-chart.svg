<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="benchTitle benchDesc">
  <title id="benchTitle">Cove v0.1.1 measured code budget</title>
  <desc id="benchDesc">A measured breakdown of Cove's 167.5 KB gzipped JavaScript and CSS against a 170 KB enforced budget. The chart is code weight, not total archive size, and excludes bundled wallpapers, fonts, HTML, icons, and runtime caches.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C162B"/>
      <stop offset="100%" stop-color="#080F1E"/>
    </linearGradient>
    <linearGradient id="coveBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="budgetBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="20" fill="#060B17"/>
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>

  <text x="40" y="44" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.2">MEASURED AT v0.1.1 · npm run budget</text>
  <text x="40" y="76" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="24" font-weight="700">167.5 KB measured. 170 KB enforced.</text>
  <text x="40" y="101" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Gzipped JavaScript + CSS in dist/. Code weight, not a total download claim.</text>

  <!-- Left panel: composition -->
  <g transform="translate(40, 126)">
    <rect width="660" height="248" rx="14" fill="url(#panel)" stroke="#1E293B"/>
    <text x="24" y="34" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Where the bytes go</text>

    <text x="24" y="68" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">new tab JS</text>
    <rect x="150" y="55" width="438" height="16" rx="4" fill="#1E293B"/>
    <rect x="150" y="55" width="408" height="16" rx="4" fill="url(#coveBar)"/>
    <text x="598" y="68" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="11" font-weight="600">138.8 KB</text>

    <text x="24" y="99" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">new tab CSS</text>
    <rect x="150" y="86" width="438" height="16" rx="4" fill="#1E293B"/>
    <rect x="150" y="86" width="63" height="16" rx="4" fill="#60A5FA"/>
    <text x="598" y="99" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="11" font-weight="600">21.4 KB</text>

    <text x="24" y="130" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">pre-paint theme</text>
    <rect x="150" y="117" width="438" height="16" rx="4" fill="#1E293B"/>
    <rect x="150" y="117" width="11" height="16" rx="4" fill="#34D399"/>
    <text x="598" y="130" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="11" font-weight="600">3.9 KB</text>

    <text x="24" y="161" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">workers, bg, blocked</text>
    <rect x="150" y="148" width="438" height="16" rx="4" fill="#1E293B"/>
    <rect x="150" y="148" width="8" height="16" rx="4" fill="#A78BFA"/>
    <text x="598" y="161" fill="#E2E8F0" font-family="ui-monospace, monospace" font-size="11" font-weight="600">3.3 KB</text>

    <line x1="24" y1="184" x2="624" y2="184" stroke="#1E293B"/>

    <text x="24" y="212" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11">measured total</text>
    <text x="24" y="240" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="21" font-weight="700">167.5 KB</text>
    <text x="160" y="240" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">of 170 KB</text>
    <text x="598" y="212" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="600">2.5 KB</text>
    <text x="598" y="240" fill="#34D399" font-family="ui-monospace, monospace" font-size="11" font-weight="600">headroom</text>
  </g>

  <!-- Right panel: what is excluded -->
  <g transform="translate(724, 126)">
    <rect width="436" height="248" rx="14" fill="url(#panel)" stroke="#1E293B"/>
    <text x="24" y="34" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">What this number is not</text>
    <text x="24" y="60" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">The full archive and browser profile are larger:</text>
    <text x="24" y="84" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">· 8 local wallpapers</text>
    <text x="24" y="106" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">· 4 self-hosted font families</text>
    <text x="24" y="128" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">· icons, HTML, and manifests</text>
    <text x="24" y="150" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">· runtime caches created after install</text>

    <line x1="24" y1="174" x2="412" y2="174" stroke="#1E293B"/>

    <text x="24" y="198" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" letter-spacing="0.4">GUARDRAILS</text>
    <text x="24" y="220" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">No runtime framework download</text>
    <text x="24" y="240" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">No third-party fonts or audio files</text>
  </g>

  <text x="40" y="398" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Methodology, limitations, and the cold-paint caveat: docs/performance.md · CI fails at 170 × 1024 bytes gzipped.</text>
</svg>
