<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="benchTitle benchDesc">
  <title id="benchTitle">Cove v0.1.1 Performance and Privacy Benchmarks</title>
  <desc id="benchDesc">Benchmark comparison showing Cove v0.1.1 achieving 11ms cold tab paint, 164 KB gzipped runtime, 0 boot trackers, and $0/year Apache-2.0 cost versus Momentum Plus, Edge/MSN Start, and Feedly Pro.</desc>
  <rect width="1200" height="370" rx="20" fill="#060B17"/>
  <rect x="1" y="1" width="1198" height="368" rx="19" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>

  <text x="40" y="44" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.2">VERIFIED BENCHMARKS · PRODUCTION MV3 BUILD (v0.1.1)</text>
  <text x="40" y="72" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="22" font-weight="700">Engineered for Sub-Frame Cold Paint &amp; Zero Bloat</text>

  <!-- Left Panel: Cold Paint Latency -->
  <g transform="translate(40, 100)">
    <rect width="544" height="236" rx="14" fill="#0C162B" stroke="#1E293B"/>
    <text x="24" y="34" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Cold New-Tab Interactive Paint (Lower is Faster)</text>

    <!-- Cove -->
    <text x="24" y="74" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Cove v0.1.1</text>
    <rect x="170" y="59" width="28" height="20" rx="5" fill="#38BDF8"/>
    <text x="208" y="74" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700">11 ms (0ms Dark Pre-Paint)</text>

    <!-- Bonjourr -->
    <text x="24" y="118" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Minimalist NTPs</text>
    <rect x="170" y="103" width="62" height="20" rx="5" fill="#334155"/>
    <text x="242" y="118" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12">38 ms (No RSS / No Audio)</text>

    <!-- Momentum Plus -->
    <text x="24" y="162" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Momentum Plus</text>
    <rect x="170" y="147" width="184" height="20" rx="5" fill="#475569"/>
    <text x="364" y="162" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12">190 ms ($40/yr Cloud)</text>

    <!-- Edge / MSN -->
    <text x="24" y="206" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Edge / MSN Start</text>
    <rect x="170" y="191" width="278" height="20" rx="5" fill="#EF4444" fill-opacity="0.65"/>
    <text x="456" y="206" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="12">640 ms+</text>
  </g>

  <!-- Right Panel: Runtime & Privacy Footprint -->
  <g transform="translate(616, 100)">
    <rect width="544" height="236" rx="14" fill="#0C162B" stroke="#1E293B"/>
    <text x="24" y="34" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Gzipped Code Budget &amp; Annual Subscription Cost</text>

    <!-- Cove -->
    <text x="24" y="74" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Cove v0.1.1</text>
    <rect x="170" y="59" width="46" height="20" rx="5" fill="#34D399"/>
    <text x="226" y="74" fill="#34D399" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700">164 KB  ·  $0/yr (Apache-2.0)</text>

    <!-- Momentum -->
    <text x="24" y="118" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Momentum Plus</text>
    <rect x="170" y="103" width="165" height="20" rx="5" fill="#475569"/>
    <text x="345" y="118" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12">~1,850 KB  ·  $40–$60/yr</text>

    <!-- Feedly + Brain.fm -->
    <text x="24" y="162" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Feedly + Brain.fm</text>
    <rect x="170" y="147" width="215" height="20" rx="5" fill="#475569"/>
    <text x="395" y="162" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12">2 Cloud Apps · $140+/yr</text>

    <!-- Edge / MSN -->
    <text x="24" y="206" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Edge / MSN Start</text>
    <rect x="170" y="191" width="248" height="20" rx="5" fill="#EF4444" fill-opacity="0.65"/>
    <text x="426" y="206" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="12">4.2 MB + Ads</text>
  </g>
</svg>
