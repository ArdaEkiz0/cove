<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-labelledby="coveHeroTitle coveHeroDesc">
  <title id="coveHeroTitle">Cove — a calm, local-first new tab</title>
  <desc id="coveHeroDesc">Cove is an Apache-2.0 Manifest V3 new tab for Chrome, Brave, Arc, Edge, Firefox, and Zen. It combines a workspace, 11 curated RSS feeds plus 3 keyless APIs, an offline reader, a Pomodoro timer, and procedural focus audio. The measured runtime is 167.7 KB gzipped. There is no account, no analytics, and no Cove server.</desc>
  <defs>
    <linearGradient id="bgCanvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="52%" stop-color="#0A1328"/>
      <stop offset="100%" stop-color="#071021"/>
    </linearGradient>
    <radialGradient id="cobaltOrb" cx="74%" cy="34%" r="56%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#0EA5E9" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#050914" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealOrb" cx="14%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#050914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13203B" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0B1325" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="subtleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="540" rx="24" fill="url(#bgCanvas)"/>
  <rect width="1280" height="540" rx="24" fill="url(#subtleGrid)"/>
  <rect width="1280" height="540" rx="24" fill="url(#cobaltOrb)"/>
  <rect width="1280" height="540" rx="24" fill="url(#tealOrb)"/>
  <rect x="1" y="1" width="1278" height="538" rx="23" fill="none" stroke="#38BDF8" stroke-opacity="0.20" stroke-width="1.5"/>

  <!-- Left editorial column -->
  <g transform="translate(64, 48)">
    <rect width="366" height="32" rx="16" fill="#0F1D37" stroke="#38BDF8" stroke-opacity="0.32"/>
    <circle cx="18" cy="16" r="4.5" fill="#34D399"/>
    <text x="32" y="20.5" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5">v0.1.1  ·  APACHE-2.0  ·  LOCAL-FIRST</text>
  </g>

  <g transform="translate(64, 112)">
    <rect width="64" height="64" rx="18" fill="url(#logoGrad)"/>
    <path d="M20 36C20 25.5 28.5 17 39 17C42.8 17 46.3 18.1 49.2 20C45.5 18.8 41.4 19.4 38.2 21.8C32.9 25.8 31.9 33.5 35.9 38.8C39.1 43 44.5 44.7 49.4 43.2C46.3 46.3 42 48.2 37.1 48.2C27.8 48.2 20.3 42.8 20 36Z" fill="#FFFFFF"/>
    <circle cx="44" cy="30" r="4.7" fill="#E0F2FE"/>
    <text x="84" y="47" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.4">Cove</text>
    <text x="212" y="45" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">github.com/DevAnimecx/cove</text>
  </g>

  <text x="64" y="250" fill="#F8FAFC" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="400" letter-spacing="-0.9">Your calm corner</text>
  <text x="64" y="304" fill="#93C5FD" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-style="italic" font-weight="400" letter-spacing="-0.7">of the web.</text>

  <text x="64" y="350" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16">A local-first new tab with curated reading, an offline</text>
  <text x="64" y="374" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16">reader, and focus tools. No account. No analytics.</text>

  <g transform="translate(64, 408)">
    <rect width="150" height="58" rx="12" fill="#0D182E" stroke="#1E3A5F"/>
    <text x="16" y="26" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">167.7 KB</text>
    <text x="16" y="45" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">gzipped runtime</text>

    <rect x="162" y="0" width="150" height="58" rx="12" fill="#0D182E" stroke="#1E3A5F"/>
    <text x="178" y="26" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">14 Sources</text>
    <text x="178" y="45" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">11 RSS + 3 APIs</text>

    <rect x="324" y="0" width="150" height="58" rx="12" fill="#0D182E" stroke="#1E3A5F"/>
    <text x="340" y="26" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">No Account</text>
    <text x="340" y="45" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">no telemetry</text>
  </g>

  <g transform="translate(64, 496)">
    <text x="0" y="16" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.9">NATIVE MV3 FOR</text>
    <text x="118" y="16" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="500">Chrome  ·  Brave  ·  Arc  ·  Edge  ·  Firefox 128+  ·  Zen</text>
  </g>

  <!-- Right: conceptual product window, no fabricated metrics -->
  <g transform="translate(712, 62)">
    <rect width="504" height="416" rx="18" fill="url(#cardGlass)" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1.2"/>
    <rect width="504" height="40" rx="18" fill="#080F1E"/>
    <rect y="22" width="504" height="18" fill="#080F1E"/>
    <circle cx="20" cy="20" r="5" fill="#EF4444" fill-opacity="0.75"/>
    <circle cx="36" cy="20" r="5" fill="#F59E0B" fill-opacity="0.75"/>
    <circle cx="52" cy="20" r="5" fill="#10B981" fill-opacity="0.75"/>
    <rect x="120" y="9" width="264" height="22" rx="6" fill="#111C33" stroke="#1E293B"/>
    <text x="252" y="24" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">cove · new tab</text>

    <!-- Side dock labels -->
    <rect x="16" y="56" width="46" height="344" rx="12" fill="#091122" stroke="#1E293B"/>
    <rect x="25" y="70" width="28" height="28" rx="8" fill="#1D4ED8"/>
    <text x="39" y="89" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">1</text>
    <text x="39" y="126" text-anchor="middle" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">2</text>
    <text x="39" y="154" text-anchor="middle" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">3</text>
    <text x="39" y="182" text-anchor="middle" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">4</text>
    <line x1="25" y1="204" x2="53" y2="204" stroke="#1E293B"/>
    <text x="39" y="232" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10">D</text>
    <text x="39" y="260" text-anchor="middle" fill="#A78BFA" font-family="ui-monospace, monospace" font-size="10">M</text>
    <text x="39" y="292" text-anchor="middle" fill="#64748B" font-family="ui-monospace, monospace" font-size="9">⌘K</text>

    <!-- Clock / search -->
    <text x="84" y="96" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="38" font-weight="650" letter-spacing="-1.1">09:41</text>
    <text x="84" y="118" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">Your calm corner of the web</text>
    <rect x="84" y="138" width="396" height="38" rx="10" fill="#091224" stroke="#2563EB" stroke-opacity="0.45"/>
    <text x="100" y="161" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">Search, calculate, or type a command…</text>

    <!-- Feature cards -->
    <rect x="84" y="194" width="190" height="94" rx="12" fill="#0B1528" stroke="#1E293B"/>
    <text x="100" y="217" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.5">COVE DISCOVER</text>
    <text x="100" y="240" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">11 feeds + 3 APIs</text>
    <text x="100" y="258" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Local ranking · offline cache</text>
    <text x="100" y="276" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Custom RSS supported</text>

    <rect x="288" y="194" width="192" height="94" rx="12" fill="#0B1528" stroke="#1E293B"/>
    <text x="304" y="217" fill="#A78BFA" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.5">FOCUS</text>
    <text x="304" y="240" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Pomodoro + sound</text>
    <text x="304" y="258" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Five textures, four modes</text>
    <text x="304" y="276" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">No audio files</text>

    <rect x="84" y="302" width="190" height="80" rx="12" fill="#0B1528" stroke="#1E293B"/>
    <text x="100" y="325" fill="#34D399" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.5">WORKSPACE</text>
    <text x="100" y="348" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Tabs, notes, sessions</text>
    <text x="100" y="366" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Local data only</text>

    <rect x="288" y="302" width="192" height="80" rx="12" fill="#0B1528" stroke="#1E293B"/>
    <text x="304" y="325" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" letter-spacing="0.5">ATMOSPHERE</text>
    <text x="304" y="348" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">8 local wallpapers</text>
    <text x="304" y="366" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">Optional Unsplash off</text>

    <text x="84" y="404" fill="#475569" font-family="ui-monospace, monospace" font-size="9.5">Illustrative layout · real product screenshots in the README</text>
  </g>

  <rect x="64" y="530" width="1152" height="1" fill="url(#hairline)"/>
</svg>
