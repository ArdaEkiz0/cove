    <line x1="90" y1="252" x2="330" y2="252" stroke="#1E293B"/>

    <text x="90" y="273" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600">Hacker News · 412 pts</text>
    <text x="90" y="291" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">Show HN: Procedural Web Audio focus synth</text>
    <text x="90" y="313" fill="#60A5FA" font-family="ui-monospace, monospace" font-size="10.5">Read in Cove News (Sanitized · 8.5 Hz Calm) →</text>

