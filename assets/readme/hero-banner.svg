    <path d="M18 33C18 23.6 25.6 16 35 16C38.4 16 41.5 17 44.1 18.7C40.8 17.6 37.1 18.1 34.2 20.3C29.4 23.9 28.5 30.8 32.1 35.6C35 39.4 39.9 40.9 44.3 39.5C41.5 42.3 37.6 44 33.2 44C24.8 44 18 39.1 18 33Z" fill="#FFFFFF"/>
