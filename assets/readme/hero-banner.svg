    <text x="194" y="41" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600">appcove.vercel.app</text>
  </g>

  <!-- Main Headline -->
  <text x="64" y="226" fill="#F8FAFC" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="400" letter-spacing="-0.6">Your calm, zero-telemetry</text>
  <text x="64" y="274" fill="#93C5FD" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-style="italic" font-weight="400" letter-spacing="-0.4">browser sanctuary.</text>

