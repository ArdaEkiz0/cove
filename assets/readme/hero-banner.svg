<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-labelledby="coveHeroTitle coveHeroDesc">
  <title id="coveHeroTitle">Cove v0.1.1 — Calm, Local-First Browser New Tab Sanctuary</title>
  <desc id="coveHeroDesc">Open-source Apache-2.0 Manifest V3 New Tab extension for Chrome, Brave, Arc, Edge, Firefox, and Zen Browser featuring 0ms Midnight Cobalt Dark Mode, 20+ source ad-free RSS newsroom, 16 Hz Web Audio neural focus sound, and on-device 2nd-order Markov memory in 164 KB gzipped.</desc>
  <defs>
    <linearGradient id="bgCanvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="52%" stop-color="#0A1328"/>
      <stop offset="100%" stop-color="#071021"/>
    </linearGradient>
    <radialGradient id="cobaltOrb" cx="72%" cy="38%" r="54%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#0EA5E9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#050914" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealOrb" cx="18%" cy="82%" r="45%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13203B" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0B1325" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accentPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <pattern id="subtleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer Frame -->
