    <text x="32" y="20.5" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="0.4">v0.1.1 RELEASE  ·  APACHE-2.0  ·  100% LOCAL-FIRST</text>
  </g>

  <!-- Brand Mark + Wordmark -->
