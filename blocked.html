<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Focus Active — Cove</title>
    <link rel="icon" type="image/svg+xml" href="/icons/cove.svg" />
    <script type="module" src="/src/boot-theme.ts"></script>
  </head>
  <body>
    <main id="blocked-root" class="blocked-shell">
      <div class="blocked-card">
        <img src="/icons/cove.svg" alt="Cove" width="44" height="44" />
        <h1>Focus session in progress.</h1>
        <p id="blocked-domain" class="blocked-domain">This site is paused while you focus.</p>
        <p class="blocked-sub">Take a slow breath, or head back to what you were making.</p>
        <div class="blocked-actions">
          <a href="/index.html" class="btn-primary">Return to Cove</a>
          <button id="pause-block-btn" type="button" class="btn-ghost">Allow for 5 minutes</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/blocked.ts"></script>
  </body>
</html>
