name: Documentation issue
description: Report unclear, missing, outdated, or broken documentation
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for improving Cove's documentation. Please include a link to the page and the exact sentence or command that is confusing.
  - type: input
    id: location
    attributes:
      label: Where is the documentation?
      description: A file path, heading, or URL.
      placeholder: docs/ARCHITECTURE.md → "The IndexedDB Cache" section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      placeholder: The install steps say to use the Chrome Web Store, but Cove is installed unpacked.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or fix
      description: Optional, but very helpful.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This is not a security vulnerability. Security reports go through private advisories.
          required: true
