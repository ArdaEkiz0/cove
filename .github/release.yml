changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
      - wontfix
    authors:
      - dependabot
      - github-actions
  categories:
    - title: "Highlights"
      labels:
        - highlight
        - release
    - title: "Privacy & security"
      labels:
        - security
        - privacy
    - title: "Features"
      labels:
        - feature
        - enhancement
    - title: "Performance & accessibility"
      labels:
        - performance
        - accessibility
    - title: "Fixes"
      labels:
        - bug
        - fix
    - title: "Documentation & community"
      labels:
        - documentation
        - github-actions
    - title: "Other changes"
      labels:
        - "*"
