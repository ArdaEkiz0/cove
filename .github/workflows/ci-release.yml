name: CI & Release Packaging

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Typecheck, Build MV3 Bundles & Audit (<165 KB Gzip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Build & package Chrome + Firefox MV3 bundles
        run: npm run build

      - name: Run zero-mock, CSP & bundle-budget test suite
        run: node --test tests/core.test.mjs

      - name: Upload MV3 extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cove-mv3-bundles
          path: |
            releases/cove-chrome-mv3-v*.zip
            releases/cove-firefox-mv3-v*.zip
            releases/SHA256SUMS.txt

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            releases/cove-chrome-mv3-v*.zip
            releases/cove-firefox-mv3-v*.zip
            releases/SHA256SUMS.txt
